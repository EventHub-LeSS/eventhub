name: Build, Push, and Deploy Docker Images For Releases

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repository owner
        id: owner
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- Frontend Image ---
      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/frontend:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.owner }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Backend Image ---
      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/backend:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.owner }}/backend:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Keycloak Image ---
      - name: Build and push Keycloak
        uses: docker/build-push-action@v5
        with:
          context: ./core
          file: ./core/Dockerfile.keycloak
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/keycloak:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.owner }}/keycloak:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Keycloak Swagger Docs
        uses: docker/build-push-action@v5
        with:
          context: ./core
          file: ./core/keycloak-swagger/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.owner }}/keycloak-swagger:${{ github.ref_name }}
            ghcr.io/${{ steps.owner.outputs.owner }}/keycloak-swagger:latest

          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Execute remote SSH commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            curl -X POST "http://localhost:${{ secrets.DOCKHAND_PORT }}/api/stacks/frontend-live/deploy?env=3" \
              -H "Content-Type: application/json" \
              -d '{"pull":true,"build":false,"forceRecreate":true}'

            curl -X POST "http://localhost:${{ secrets.DOCKHAND_PORT }}/api/stacks/backend-live/deploy?env=3" \
              -H "Content-Type: application/json" \
              -d '{"pull":true,"build":false,"forceRecreate":true}'

            curl -X POST "http://localhost:${{ secrets.DOCKHAND_PORT }}/api/stacks/keycloak-live/deploy?env=3" \
              -H "Content-Type: application/json" \
              -d '{"pull":true,"build":false,"forceRecreate":true}'

            curl -X POST "http://localhost:${{ secrets.DOCKHAND_PORT }}/api/stacks/keycloak-swagger-live/deploy?env=3" \
              -H "Content-Type: application/json" \
              -d '{"pull":true,"build":false,"forceRecreate":true}'
