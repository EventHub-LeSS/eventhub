name: Pull Request Build Checks

on:
  pull_request:
    branches:
      - main

jobs:
  # --- Frontend Build Check ---
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for frontend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend (Test)
        if: steps.filter.outputs.frontend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false # Only test the build, do not push
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Backend Build Check ---
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for backend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'

      - name: Set up Go
        if: steps.filter.outputs.backend == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: ./backend/go.mod
          cache-dependency-path: ./backend/go.sum

      - name: Start test database (PostgreSQL with pg_cron)
        if: steps.filter.outputs.backend == 'true'
        run: |
          docker build -f core/Dockerfile.api-db -t eventhub-api-db:test core
          docker run -d --name test-db -p 5432:5432 \
            -e POSTGRES_USER=eventhub -e POSTGRES_PASSWORD=test -e POSTGRES_DB=eventhub \
            eventhub-api-db:test postgres -c shared_preload_libraries=pg_cron \
            -c cron.use_background_workers=on -c cron.timezone=UTC -c cron.database_name=eventhub
          for i in $(seq 1 30); do
            docker exec test-db pg_isready -U eventhub -d eventhub && exit 0
            sleep 2
          done
          docker logs test-db
          exit 1

      - name: Run backend tests
        if: steps.filter.outputs.backend == 'true'
        working-directory: ./backend
        env:
          TEST_DATABASE_DSN: postgres://eventhub:test@localhost:5432/eventhub?sslmode=disable
        run: go test -race -p 1 ./...

      - name: Set up Docker Buildx
        if: steps.filter.outputs.backend == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Backend (Test)
        if: steps.filter.outputs.backend == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false # Only test the build, do not push
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Keycloak Build Check ---
  build-keycloak:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for keycloak changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            keycloak:
              - 'core/**'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.keycloak == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Keycloak (Test)
        if: steps.filter.outputs.keycloak == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./core
          file: ./core/Dockerfile.keycloak
          push: false # Only test the build, do not push
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --- Keycloak-Swagger Build Check ---
  build-keycloak-swagger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for keycloak changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            keycloak-swagger:
              - 'core/**'

      - name: Set up Docker Buildx
        if: steps.filter.outputs.keycloak-swagger == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build keycloak-swagger (Test)
        if: steps.filter.outputs.keycloak-swagger == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./core/keycloak-swagger
          file: ./core/keycloak-swagger/Dockerfile
          push: false # Only test the build, do not push
          cache-from: type=gha
          cache-to: type=gha,mode=max
