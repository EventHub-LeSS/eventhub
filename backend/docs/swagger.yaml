  /bookings/{bookingId}/cancel:
    post:
      description: 'Storniert eine Buchung des Aufrufers und gibt deren Tickets frei.
        Eine Reservierung ohne Zahlung ist ein Warenkorb-Item und wird für sich storniert.
        Eine Buchung mit Zahlung wird mit dem ganzen Zahlungsvorgang storniert: Während
        die Zahlung offen ist, wird der gesamte Checkout storniert — es wurde nichts
        abgebucht — und nachdem sie bezahlt wurde, wird der Zeilenbetrag der Buchung
        zurückerstattet; der Zahlungsvorgang gilt als erstattet, sobald alle seine
        Buchungen storniert sind. Wiederholtes Stornieren gelingt ohne weitere Erstattung.'
      parameters:
      - description: Booking ID
        in: path
        name: bookingId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BookingModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Buchung in diesem Status nicht stornierbar
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Buchung stornieren
      tags:
      - bookings
