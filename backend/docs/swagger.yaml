      - description: Organization UUID
        in: query
        name: organizationId
        type: string
      - default: 1
        description: Page
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 50
        description: Page size
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ModeratedEventPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List events for moderation
      tags:
      - moderation
  /moderation/events/{eventId}:
    get:
      description: Full event content in any status. Requires admin or moderator.
      parameters:
      - description: Event UUID
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ModeratedEvent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Inspect an event for moderation
      tags:
      - moderation
  /moderation/events/{eventId}/content:
    patch:
      consumes:
      - application/json
      description: Requires admin or moderator and a reason of 1-1000 characters after
        trimming. Supply title (3-200 characters after trimming), description (0-5000
        characters; empty clears it), or both. Other event fields and status stay
        unchanged. Works in any status. Changes, previous values, reason and actor
        are recorded atomically. An unchanged request returns changed=false without
        an audit entry.
      parameters:
      - description: Event UUID
        in: path
        name: eventId
        required: true
        type: string
      - description: Content correction and reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ModerateEventContentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EventModerationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Correct problematic event text
      tags:
      - moderation
  /moderation/events/{eventId}/withdraw:
    post:
      consumes:
      - application/json
      description: Requires admin or moderator and a reason of 1-1000 characters after
        trimming. Draft and published events become cancelled and disappear from public
        lists, details and recommendations. New bookings and payment completion are
        rejected; existing bookings and payments remain in the history and tickets
        are invalid. No automatic refunds. Completed events return 409. Events already
        withdrawn by moderation return changed=false without another audit entry.
        Events previously withdrawn by their organizer receive a moderation block
        so they cannot be restored or republished by organizers. The status change,
        reason and actor are recorded atomically.
      parameters:
      - description: Event UUID
        in: path
        name: eventId
        required: true
        type: string
      - description: Moderation reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.EventModerationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EventModerationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Withdraw a problematic event
      tags:
      - moderation
  /moderation/ratings:
    get:
      description: Returns a page of all ratings including their text, newest first,
        with event and organization. Requires the global role admin or moderator.
        Unlike the public summaries, hidden ratings and ratings of any booking status
        are included; hidden filters by visibility, eventId by rated event. eventId,
        eventTitle, organizationId and organizationName are null if the rating no
        longer belongs to an event or organization. Hidden ratings are released with
        PUT /moderation/ratings/{ratingId}/visibility and hidden=false.
      parameters:
      - description: Only hidden (true) or only visible (false) ratings
        in: query
        name: hidden
        type: boolean
      - description: Only ratings of this event
        in: query
        name: eventId
        type: string
      - default: 1
        description: Page number (1-indexed)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 50
        description: Page size (1-100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ModeratedRatingPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List ratings for moderation
      tags:
      - moderation
  /moderation/ratings/{ratingId}/visibility:
    put:
      consumes:
      - application/json
      description: Hides (hidden=true) a rating or releases it again (hidden=false),
        which withdraws an earlier hiding. Requires the global role admin or moderator.
        Hidden ratings no longer count towards rating summaries and recommendations.
        The reason (1-1000 characters after trimming) is required and is stored with
        the acting user in the audit log of the organization that owns the rated event
        (organization_id "platform" if the rating no longer belongs to an organization).
        Requesting the current visibility returns changed=false and records nothing.
      parameters:
      - description: Rating ID
        in: path
        name: ratingId
        required: true
        type: string
      - description: Visibility and reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RatingVisibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RatingVisibilityResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hide or release a rating
      tags:
      - moderation
  /notifications:
    get:
      description: 'Returns only the authenticated user''s notifications, newest first.
        The response contains items, page, limit and total; empty pages return items:
        []. readAt is null for unread notifications. Simulated reminder content and
        scheduledAt are refreshed from current event and location data before display;
        changed reminders become unread. Simulation is immediately visible, even before
        scheduledAt; no email is sent. Cancellation notices (occasion event_cancelled,
        EVENTHUB-291) are created when an upcoming event with own confirmed bookings
        is withdrawn; they reference the event via eventId, their scheduledAt is the
        time of the withdrawal and they are not refreshed.'
      parameters:
      - default: 1
        description: Page number (1-indexed)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 50
        description: Page size (1-100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.NotificationPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List own notifications
      tags:
      - notifications
  /notifications/{notificationId}/read:
    patch:
      description: Idempotently sets readAt. Foreign and unknown notifications return
        404. Changed simulated reminders become unread again on their next refresh.
      parameters:
      - description: Notification UUID
        in: path
        name: notificationId
        required: true
