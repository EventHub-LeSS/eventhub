            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Restore withdrawn event as draft
      tags:
      - events
  /events/{id}/withdraw:
    post:
      description: Withdraws a published event so that it is no longer bookable. Requires
        the event_manager role in the organization that owns the event. Only events
        in status published can be withdrawn; the event status becomes cancelled.
        If the event has not begun yet, every user with a confirmed booking receives
        one in-app notification (occasion event_cancelled, eventId set, bookingId
        null) covering all of their confirmed bookings of the event, and the reminders
        of the event are deleted. An event that was republished after a withdrawal
        notifies its ticket holders again when it is withdrawn again; earlier notices
        are kept. notifiedUsers counts the notified users. Bookings and payments stay
        unchanged; the notification tells the users that the organizer will contact
        them about the refund. The status change, notifications and audit entry are
        saved together or not at all.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EventWithdrawnResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Withdraw event
      tags:
      - events
  /events/draft:
    post:
      consumes:
      - application/json
      description: Creates an event in status draft. Drafts are only visible to the
        organization that owns them and can be edited (PUT /events/{id}) and published
        (POST /events/{id}/publish) later. Requires the event_manager role in the
        owning organization. organizationId is the Keycloak organization ID or alias
        as returned by GET /users/me; it may be omitted when the caller manages events
        in exactly one organization. location holds the address fields; the event
        is linked to the stored location with the same address (compared case-insensitively),
        which is created if there is none. GET /locations lists existing locations
        to fill the fields.
      parameters:
      - description: Draft event data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateDraftRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.EventModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unknown categoryId
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Save event as draft
      tags:
      - events
  /events/org/{id}:
    get:
      description: Returns all events of the organization, in every status including
        drafts. The organization is addressed by its database UUID or by its alias,
        which is what tokens carry. Requires membership in the organization, regardless
        of role. Organizations the caller is not a member of return 404, like unknown
        ones.
      parameters:
      - description: Organization database UUID or alias
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Events of the organization; an empty array if there are none
          schema:
            items:
              $ref: '#/definitions/model.EventModel'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List organization events
      tags:
      - events
  /events/self:
    get:
      description: Returns the events of all organizations in which the caller holds
        the event_manager role, ordered by start time. Use status=draft to list the
        own drafts. Drafts are never visible to other organizations or visitors.
      parameters:
      - description: Only return events in this status
        enum:
        - draft
        - published
        - cancelled
        - completed
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Own events; an empty array if there are none
          schema:
            items:
              $ref: '#/definitions/model.EventModel'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List own events
      tags:
