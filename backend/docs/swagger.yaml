          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List organization events
      tags:
      - events
  /events/self:
    get:
      description: Returns the events of all organizations in which the caller holds
        the event_manager role, ordered by start time. Use status=draft to list the
        own drafts. Drafts are never visible to other organizations or visitors.
      parameters:
      - description: Only return events in this status
        enum:
        - draft
        - published
        - cancelled
        - completed
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Own events; an empty array if there are none
          schema:
            items:
              $ref: '#/definitions/model.EventModel'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List own events
      tags:
      - events
  /locations:
    get:
      description: 'Returns the stored locations an organizer can pick to fill the
        address fields of an event: the locations of all events that are no drafts
        and of every event of the organizations in which the caller holds the event_manager
        role. Locations used only by drafts of other organizations are not listed.
        Saving an event with the same address, compared case-insensitively, reuses
        the location; any other address creates a new one. Locations are never changed.
        Sorted by city, street, house number and address addition.'
      produces:
      - application/json
      responses:
        "200":
          description: Selectable locations; an empty array if there are none
          schema:
            items:
              $ref: '#/definitions/model.PublishedEventLocation'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List selectable locations
      tags:
      - locations
  /me/bookings:
    get:
      description: Liefert alle Buchungen des Aufrufers in jedem Status, die neueste
        zuerst, mit Event, Ort, Ticketanzahl, Buchungs- und Zahlungsstatus, failureReason
        und ticketsValid. bookingStatus ist der gespeicherte Status, nur eine nach
        der Datenbankuhr abgelaufene Reservierung wird als expired angezeigt. GET
        /bookings/{bookingId}/payment zeigt dagegen den gespeicherten Status reserved,
        bei offener Zahlung bis zum Cleanup der Zahlungen nach höchstens etwa einer
        Minute; ohne Zahlung liefert es 404. status filtert auf den angezeigten Status,
        expired findet also gespeicherte und abgeleitete abgelaufene Buchungen. Ein
        leeres Array, wenn es keine Buchungen gibt.
      parameters:
      - description: Nur Buchungen mit diesem angezeigten Status
        enum:
        - reserved
        - confirmed
        - cancelled
        - failed
        - expired
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.OwnBookingResponse'
            type: array
        "400":
          description: Ungültiger status
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Nutzer nicht in der API-Datenbank synchronisiert
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Meine Buchungshistorie
      tags:
      - bookings
  /me/bookings/{bookingId}:
    get:
      description: Liefert eine Buchung des Aufrufers in jedem Status mit Event, Ort,
        Ticketanzahl, Buchungsstatus, Zahlungsstatus, Betrag, failureReason und ticketsValid.
        Ungültige, stornierte oder abgelaufene Buchungen sowie Tickets abgesagter
        Events sind mit ticketsValid false markiert. ticketsValid, paymentStatus,
        failureReason und message entsprechen GET /bookings/{bookingId}/payment, weil
        beide dieselbe Regel und dieselben Texte nutzen. bookingStatus zeigt eine
        nach der Datenbankuhr abgelaufene Reservierung als expired, GET /bookings/{bookingId}/payment
        den gespeicherten Status, bei offener Zahlung bis zum Cleanup nach höchstens
        etwa einer Minute. Unbekannte Buchungen und Buchungen anderer Nutzer liefern
        beide 404.
      parameters:
      - description: Booking ID
        in: path
        name: bookingId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.OwnBookingResponse'
        "400":
          description: Ungültige Booking ID
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Nutzer nicht in der API-Datenbank synchronisiert
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Buchung unbekannt oder von einem anderen Nutzer
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ticketdetails einer eigenen Buchung
      tags:
      - bookings
  /me/tickets:
    get:
      description: 'Liefert die gültigen Tickets des Aufrufers: nur Buchungen mit
        ticketsValid true, also bezahlt, bestätigt und für ein veröffentlichtes oder
        abgeschlossenes Event. Kommende Events zuerst nach Startzeit aufsteigend,
        danach vergangene nach Startzeit absteigend; ein Event gilt als kommend, bis
        es nach der Datenbankuhr geendet hat. Jeder Eintrag enthält bookingId für
        GET /me/bookings/{bookingId} und ratingScore, den Score, mit dem der Aufrufer
        das Event bewertet hat, oder null, wenn noch nicht bewertet; die Bewertung
        zählt pro Nutzer und Event. Ticketliste, Buchungshistorie, Ticketdetails und
        GET /bookings/{bookingId}/payment wenden dieselbe Gültigkeitsregel an. Ein
        leeres Array, wenn es keine gültigen Tickets gibt.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.OwnBookingResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Nutzer nicht in der API-Datenbank synchronisiert
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Meine Tickets
      tags:
      - bookings
  /moderation/ratings:
    get:
      description: Returns a page of all ratings including their text, newest first,
        with event and organization. Requires the global role admin or moderator.
        Unlike the public summaries, hidden ratings and ratings of any booking status
        are included; hidden filters by visibility, eventId by rated event. eventId,
        eventTitle, organizationId and organizationName are null if the rating no
        longer belongs to an event or organization. Hidden ratings are released with
        PUT /moderation/ratings/{ratingId}/visibility and hidden=false.
      parameters:
      - description: Only hidden (true) or only visible (false) ratings
        in: query
        name: hidden
        type: boolean
      - description: Only ratings of this event
        in: query
        name: eventId
        type: string
      - default: 1
        description: Page number (1-indexed)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 50
        description: Page size (1-100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ModeratedRatingPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List ratings for moderation
      tags:
      - moderation
  /moderation/ratings/{ratingId}/visibility:
    put:
      consumes:
      - application/json
      description: Hides (hidden=true) a rating or releases it again (hidden=false),
        which withdraws an earlier hiding. Requires the global role admin or moderator.
        Hidden ratings no longer count towards rating summaries and recommendations.
        The reason (1-1000 characters after trimming) is required and is stored with
        the acting user in the audit log of the organization that owns the rated event
        (organization_id "platform" if the rating no longer belongs to an organization).
        Requesting the current visibility returns changed=false and records nothing.
      parameters:
      - description: Rating ID
        in: path
        name: ratingId
        required: true
        type: string
      - description: Visibility and reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.RatingVisibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.RatingVisibilityResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Hide or release a rating
      tags:
      - moderation
  /notifications:
    get:
      description: 'Returns only the authenticated user''s notifications, newest first.
        The response contains items, page, limit and total; empty pages return items:
        []. readAt is null for unread notifications. Simulated reminder content and
        scheduledAt are refreshed from current event and location data before display;
        changed reminders become unread. Simulation is immediately visible, even before
        scheduledAt; no email is sent.'
      parameters:
      - default: 1
        description: Page number (1-indexed)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 50
        description: Page size (1-100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.NotificationPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List own notifications
      tags:
      - notifications
  /notifications/{notificationId}/read:
    patch:
      description: Idempotently sets readAt. Foreign and unknown notifications return
