  /events:
    get:
      description: Public list of published events with their category, location and
        organizer alias. Optional location searches city or venue name; categoryId
        selects an exact category. date selects the start calendar day in Europe/Berlin
        (YYYY-MM-DD). All filters are combined using AND. Omit a filter or pass an
        empty value to reset it. Unknown categories and searches without matches return
        200 with []. Invalid dates, invalid category UUIDs or location values exceeding
        200 characters after trimming return 400. Events missing a category, location
        or organizer are omitted. Sorted by start time and event ID.
      parameters:
      - description: Case-insensitive substring of city or venue name; trimmed, empty
          means no filter, maximum 200 characters. Wildcards are treated literally.
        in: query
        name: location
        type: string
      - description: Exact category UUID; trimmed, empty means no category filter.
          Combined with location using AND.
        in: query
        name: categoryId
        type: string
      - description: Start date in YYYY-MM-DD format, interpreted in Europe/Berlin.
          Empty means no date filter.
        in: query
        name: date
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.PublishedEventResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: List published events
      tags:
      - events
  /events/{eventId}:
    get:
      description: Public event details with description, category, location, organizer
        alias, price, capacity, availableSeats and bookable. Available seats account
        for confirmed tickets and unexpired reservations. soldTickets counts confirmed
        tickets; occupancyPercent is their share of capacity, rounded to two decimals
        and capped at 100. availability is available, almost_sold_out (at least 90%
        confirmed and still bookable), sold_out (confirmed tickets exhaust capacity),
        or temporarily_unavailable (live reservations block booking). Sold-out published
        events remain visible with bookable=false. Booking via POST /bookings requires
        authentication and checks availability again. Unpublished events and events
        missing category, location or organizer return 404.
      parameters:
      - description: Event UUID
        in: path
        name: eventId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PublishedEventDetailsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Get published event details
      tags:
      - events
