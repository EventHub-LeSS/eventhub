      description: Creates an in-app reminder for an own confirmed booking of an upcoming
        published event. scheduledAt is 24 hours before the event or now for short-notice
        bookings. Simulation displays it immediately. Repeated calls refresh the existing
        reminder from current event data. Changed reminders become unread. No email
        or external delivery service is used. Foreign bookings return 404.
