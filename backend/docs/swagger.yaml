  /events/{id}:
    delete:
      description: Irrevocably deletes a draft event. Requires the event_manager or
        org_admin role in the organization that owns the event. Only events in status
        draft can be deleted; published, cancelled and completed events return 400.
        Events with bookings in any status are never deleted and return 409, because
        the bookings belong to the booking history of the visitors. The audit log
        entries of the event are kept.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EventDeletedResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Event has bookings
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete draft event
      tags:
      - events
    put:
      consumes:
      - application/json
      description: Updates title, description, time span, location, category, price
        and capacity of an event. Requires the event_manager role in the organization
        that owns the event. Only events in status draft or published can be edited.
        The capacity cannot be lowered below the tickets already sold or reserved
        (409). A changed address links the event to the stored location with that
        address, created if there is none; locations themselves are never changed,
        so other events at the previous address are not affected.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated event data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EventModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Capacity below the tickets already sold or reserved
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
