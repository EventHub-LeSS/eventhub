      consumes:
      - application/json
      description: Updates title, description, time span, location, category, price
        and capacity of an event. Requires the event_manager role in the organization
        that owns the event. Only events in status draft or published can be edited.
        The capacity cannot be lowered below the tickets already sold or reserved
        (409). A changed address links the event to the stored location with that
        address, created if there is none; locations themselves are never changed,
        so other events at the previous address are not affected.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated event data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EventModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Capacity below the tickets already sold or reserved
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update event
      tags:
      - events
  /events/{id}/publish:
    post:
      description: Publishes a draft event so that visitors can find and book it.
        Requires the event_manager role in the organization that owns the event. Only
        sufficiently complete events in status draft can be published. If the event
        is already published, returns 400 with detail "this event is already published".
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EventActionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Publish event
      tags:
      - events
  /events/{id}/ratings:
    post:
      consumes:
      - application/json
      description: Creates one rating per authenticated visitor and event. The visitor
        must have a confirmed booking for this event, and the event must have ended
        without being cancelled. Text is optional (at most 2000 characters); score
        must be between 1 and 5. Ratings are visible immediately.
      parameters:
      - description: Event UUID
        in: path
        name: id
        required: true
        type: string
      - description: Rating
        in: body
        name: rating
        required: true
        schema:
          $ref: '#/definitions/handler.CreateEventRatingRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.RatingModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Rate an event
      tags:
      - events
  /events/{id}/withdraw:
    post:
      description: Withdraws a published event so that it is no longer bookable. Requires
        the event_manager role in the organization that owns the event. Only events
        in status published can be withdrawn; the event status becomes cancelled.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EventWithdrawnResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Withdraw event
      tags:
      - events
  /events/draft:
    post:
      consumes:
      - application/json
      description: Creates an event in status draft. Drafts are only visible to the
        organization that owns them and can be edited (PUT /events/{id}) and published
        (POST /events/{id}/publish) later. Requires the event_manager role in the
        owning organization. organizationId is the Keycloak organization ID or alias
        as returned by GET /users/me; it may be omitted when the caller manages events
        in exactly one organization. location holds the address fields; the event
        is linked to the stored location with the same address (compared case-insensitively),
        which is created if there is none. GET /locations lists existing locations
        to fill the fields.
      parameters:
      - description: Draft event data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateDraftRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.EventModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Unknown categoryId
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Save event as draft
      tags:
      - events
  /events/org/{id}:
    get:
      description: Returns all events of the organization, in every status including
        drafts. The organization is addressed by its database UUID or by its alias,
        which is what tokens carry. Requires membership in the organization, regardless
        of role. Organizations the caller is not a member of return 404, like unknown
        ones.
      parameters:
      - description: Organization database UUID or alias
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Events of the organization; an empty array if there are none
          schema:
            items:
              $ref: '#/definitions/model.EventModel'
            type: array
        "401":
