basePath: /api/v1
definitions:
  handler.CurrentOrganizationResponse:
    properties:
      alias:
        type: string
      id:
        type: string
      roles:
        items:
          $ref: '#/definitions/middleware.OrganizationRole'
        type: array
    type: object
  handler.CurrentUserResponse:
    properties:
      globalRoles:
        items:
          $ref: '#/definitions/middleware.GlobalRole'
        type: array
      organization:
        $ref: '#/definitions/handler.CurrentOrganizationResponse'
      organizations:
        items:
          $ref: '#/definitions/handler.CurrentOrganizationResponse'
        type: array
      subject:
        type: string
      username:
        type: string
    type: object
  middleware.GlobalRole:
    enum:
    - admin
    - moderator
    - visitor
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleModerator
    - RoleVisitor
  middleware.OrganizationRole:
    enum:
    - org_admin
    - event_manager
    - finance_viewer
    type: string
    x-enum-varnames:
    - RoleOrganizationAdmin
    - RoleEventManager
    - RoleFinanceViewer
  model.APIError:
    properties:
      error:
        $ref: '#/definitions/model.APIErrorDetail'
    type: object
  model.APIErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  model.CreateOrganizationRequest:
    properties:
      alias:
        type: string
      city:
        type: string
      contactEmail:
        type: string
      contactPhoneNumber:
        type: string
      countryCode:
        type: string
      houseNumber:
        type: string
      name:
        type: string
      orgAdmin:
        type: string
      postalCode:
        type: string
      street:
        type: string
    required:
    - alias
    - name
    - orgAdmin
    type: object
  model.CreateOrganizationResponse:
    properties:
      alias:
        type: string
      id:
        type: string
      message:
        type: string
      name:
        type: string
    type: object
  model.DebugTokenRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  model.DebugTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  model.ErrorResponse:
    properties:
      detail:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  model.EventModel:
    properties:
      capacity:
        type: integer
      categoryId:
        type: string
      createdAt:
        type: string
      description:
        type: string
      endTime:
        type: string
      eventId:
        type: string
      locationId:
        type: string
      organizerId:
        type: string
      price:
        type: number
      startTime:
        type: string
      status:
        $ref: '#/definitions/model.EventStatus'
      title:
        type: string
      updatedAt:
        type: string
    type: object
  model.EventStatus:
    enum:
    - draft
    - published
    - cancelled
    - completed
    type: string
    x-enum-varnames:
    - EventStatusDraft
    - EventStatusPublished
    - EventStatusCancelled
    - EventStatusCompleted
  model.HealthcheckModel:
    properties:
      message:
        type: string
      time:
        type: string
    type: object
  model.UpdateEventRequest:
    properties:
      capacity:
        maximum: 100000
        minimum: 1
        type: integer
      categoryId:
        type: string
      description:
        maxLength: 5000
        type: string
      endTime:
        type: string
      locationId:
        type: string
      price:
        maximum: 10000
        minimum: 0
        type: number
      startTime:
        type: string
      title:
        maxLength: 200
        minLength: 3
        type: string
    required:
    - capacity
    - categoryId
    - endTime
    - locationId
    - startTime
    - title
    type: object
info:
  contact: {}
  description: REST API for the EventHub platform
  title: EventHub API
  version: "1.0"
paths:
  /:
    get:
      description: Returns service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthcheckModel'
      summary: Health check
      tags:
      - system
  /debug/token:
    post:
      consumes:
      - application/json
      description: TEST ONLY — accepts username/password and returns a Keycloak access
        token. Disabled in production (requires DEBUG_ENABLED=true).
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.DebugTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.DebugTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: '[DEBUG] Get access token'
      tags:
      - debug
  /events/{id}:
    put:
      consumes:
      - application/json
      description: Updates title, description, time span, location, category, price
        and capacity of an event. Requires the event_manager role in the organization
        that owns the event. Only events in status draft or published can be edited.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated event data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EventModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update event
      tags:
      - events
  /organizations/:
    post:
      consumes:
      - application/json
      description: Creates a new organization in Keycloak and the API database. Requires
        the admin role on the backend client.
      parameters:
      - description: Organization to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateOrganizationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.CreateOrganizationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create organization
      tags:
      - organizations
  /users/me:
    get:
      description: Returns the authenticated user's profile, global roles, active
        organization, and organization memberships
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CurrentUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer {token}" where {token} is a Keycloak access token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
