  /locations:
    get:
      description: 'Returns the stored locations an organizer can pick to fill the
        address fields of an event: the locations of all events that are no drafts
        and of every event of the organizations in which the caller holds the event_manager
        role. Locations used only by drafts of other organizations are not listed.
        Saving an event with the same address, compared case-insensitively, reuses
        the location; any other address creates a new one. Locations are never changed.
        Sorted by city, street, house number and address addition.'
      produces:
      - application/json
      responses:
        "200":
          description: Selectable locations; an empty array if there are none
          schema:
            items:
              $ref: '#/definitions/model.PublishedEventLocation'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List selectable locations
      tags:
      - locations
  /me/bookings:
    get:
      description: Liefert alle Buchungen des Aufrufers in jedem Status, die neueste
        zuerst, mit Event, Ort, Ticketanzahl, Buchungs- und Zahlungsstatus, failureReason
        und ticketsValid. bookingStatus ist der gespeicherte Status, nur eine nach
        der Datenbankuhr abgelaufene Reservierung wird als expired angezeigt. GET
        /bookings/{bookingId}/payment zeigt dagegen den gespeicherten Status reserved,
        bei offener Zahlung bis zum Cleanup der Zahlungen nach höchstens etwa einer
        Minute; ohne Zahlung liefert es 404. status filtert auf den angezeigten Status,
        expired findet also gespeicherte und abgeleitete abgelaufene Buchungen. Ein
        leeres Array, wenn es keine Buchungen gibt.
      parameters:
      - description: Nur Buchungen mit diesem angezeigten Status
        enum:
        - reserved
        - confirmed
        - cancelled
        - failed
        - expired
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.OwnBookingResponse'
            type: array
        "400":
          description: Ungültiger status
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Nutzer nicht in der API-Datenbank synchronisiert
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Meine Buchungshistorie
      tags:
      - bookings
  /me/bookings/{bookingId}:
    get:
      description: Liefert eine Buchung des Aufrufers in jedem Status mit Event, Ort,
        Ticketanzahl, Buchungsstatus, Zahlungsstatus, Betrag, failureReason und ticketsValid.
        Ungültige, stornierte oder abgelaufene Buchungen sowie Tickets abgesagter
        Events sind mit ticketsValid false markiert. ticketsValid, paymentStatus,
        failureReason und message entsprechen GET /bookings/{bookingId}/payment, weil
        beide dieselbe Regel und dieselben Texte nutzen. bookingStatus zeigt eine
        nach der Datenbankuhr abgelaufene Reservierung als expired, GET /bookings/{bookingId}/payment
        den gespeicherten Status, bei offener Zahlung bis zum Cleanup nach höchstens
        etwa einer Minute. Unbekannte Buchungen und Buchungen anderer Nutzer liefern
        beide 404.
      parameters:
      - description: Booking ID
        in: path
        name: bookingId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.OwnBookingResponse'
        "400":
          description: Ungültige Booking ID
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Nutzer nicht in der API-Datenbank synchronisiert
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Buchung unbekannt oder von einem anderen Nutzer
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Ticketdetails einer eigenen Buchung
      tags:
      - bookings
  /me/organizer-applications:
    get:
      description: All organizer applications of the authenticated user with their
        review state, newest first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.OrganizerApplicationModel'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List own organizer applications
      tags:
      - organizer-applications
  /me/tickets:
    get:
      description: 'Liefert die gültigen und die stornierten Tickets des Aufrufers.
        Gültig sind Buchungen mit ticketsValid true, also bezahlt, bestätigt und für
        ein veröffentlichtes oder abgeschlossenes Event. Storniert sind bezahlte Tickets
        mit cancelledBy: organizer, wenn der Veranstalter das Event abgesagt hat,
        oder user, wenn der Aufrufer die Buchung nach der Bezahlung storniert hat;
        sie haben ticketsValid false. Warenkorb-Reservierungen und vor der Bezahlung
        abgebrochene Checkouts erscheinen nicht. Kommende Events zuerst nach Startzeit
        aufsteigend, danach vergangene nach Startzeit absteigend; ein Event gilt als
        kommend, bis es nach der Datenbankuhr geendet hat. Jeder Eintrag enthält bookingId
        für GET /me/bookings/{bookingId} und ratingScore, den Score, mit dem der Aufrufer
        das Event bewertet hat, oder null, wenn noch nicht bewertet; die Bewertung
        zählt pro Nutzer und Event. Ticketliste, Buchungshistorie, Ticketdetails und
        GET /bookings/{bookingId}/payment wenden dieselbe Gültigkeitsregel an. Ein
        leeres Array, wenn es weder gültige noch stornierte Tickets gibt.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.OwnBookingResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Nutzer nicht in der API-Datenbank synchronisiert
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Meine Tickets
      tags:
      - bookings
  /moderation/events:
    get:
      description: All event statuses and full descriptions, including withdrawn events.
        Requires admin or moderator. Newest first; organizationId is the local organization
        UUID.
      parameters:
