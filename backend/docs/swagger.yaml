          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Mark own notification as read
      tags:
      - notifications
  /organizations/:
    post:
      consumes:
      - application/json
      description: Creates a new organization in Keycloak and the API database. Requires
        the admin role on the backend client.
      parameters:
      - description: Organization to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateOrganizationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.CreateOrganizationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create organization
      tags:
      - organizations
  /organizations/{organizationID}:
    get:
      description: 'Returns the details of an organization: display name, alias, contact
        columns and timestamps. Requires membership of the organization in any role
        (global admins bypass this check). organizationID is the Keycloak organization
        ID or alias as returned by POST /organizations and GET /users/me. The display
        name is loaded from the API database; the alias is the identity reference
        the token claim carries.'
      parameters:
      - description: Keycloak organization ID or Alias
        in: path
        name: organizationID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.OrganizationDetailsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get organization details
      tags:
      - organizations
    put:
      consumes:
      - application/json
      description: 'Sets the display name of an organization. Requires the org_admin
        role in the given organization (global admins bypass this check); it is checked
        against the token and again against Keycloak, so a demoted admin cannot act
        on an old token. The change runs Keycloak first, then the API database row,
        and both are recorded in the audit log: a started entry before the first change
        and a result entry afterwards sharing one operationId; a result entry that
        could not be written is reported with 500 and the request is safe to retry.
        name is required; the alias is read-only, because the token claim carries
        it — sending it with a different value is rejected with 400. organizationID
        is the Keycloak organization ID or alias.'
      parameters:
      - description: Keycloak organization ID or Alias
        in: path
        name: organizationID
        required: true
        type: string
      - description: Organization details to set
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateOrganizationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UpdateOrganizationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update organization details
      tags:
      - organizations
  /organizations/{organizationID}/audit-logs:
    get:
      description: 'Returns the audit log of an organization, newest entries first:
        who (personal account) changed what and when. Covers event changes (including
        price changes, publishing and cancellation) and changes of member roles. Requires
        the org_admin role in the given organization (global admins bypass this check).
        organizationID is the Keycloak organization ID or alias. Entries of operations
        in Keycloak consist of a "started" entry and a "succeeded" or "incomplete"
        entry with the same operationId; a "started" entry without a result means
        the outcome is unconfirmed. Entries are deleted ten years after they were
        recorded. Use nextCursor from the response as cursor to get the next page.'
      parameters:
      - description: Keycloak organization ID or Alias
        in: path
        name: organizationID
        required: true
        type: string
      - description: Entries per page (default 50, maximum 100)
        in: query
        name: limit
        type: integer
      - description: Cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuditLogPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List organization audit log
      tags:
      - organizations
  /organizations/{organizationID}/dashboard:
    get:
      description: Returns sales figures for events of the selected organization.
        Requires the finance_viewer role in that organization. The organization can
        be addressed by its local UUID, Keycloak ID or alias. Sold tickets count only
        confirmed bookings. Available seats are capacity minus confirmed tickets,
        with a minimum of zero. Returns an empty array if the organization has no
        events.
      parameters:
      - description: Organization UUID, Keycloak ID or alias
        in: path
        name: organizationID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.SalesDashboardEventResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get organization sales dashboard
      tags:
      - organizations
  /organizations/{organizationID}/members/{username}/roles:
    put:
      consumes:
      - application/json
      description: 'Replaces the complete role set of an organization member. Requires
        the org_admin role in the given organization (global admins bypass this check);
        it is checked against the token and again against Keycloak, so a demoted admin
        cannot act on an old token. organizationID is the Keycloak organization ID
        or alias as returned by POST /organizations and GET /users/me. roles is required;
        an empty array removes all roles. Roles: org_admin (manage members), event_manager
        (manage events), finance_viewer (view sales and billing). Removing the last
        org_admin is rejected. The affected user must refresh their token before the
        new roles take effect.'
      parameters:
      - description: Keycloak organization ID or Alias
        in: path
        name: organizationID
        required: true
        type: string
      - description: Username of the organization member
        in: path
        name: username
        required: true
        type: string
      - description: Complete role set for the member (empty array = no roles)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ConfigureOrgRolesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ConfigureOrgRolesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Configure organization member roles
      tags:
      - organizations
  /organizations/{organizationID}/rating-summary:
    get:
      description: Public average of unrounded event averages, with equal weight per
        rated event. Includes only this organization's published or completed events
        with endTime <= database time. Uses the same visible, score 1–5, confirmed-booking
        ratings as event summaries. Unrated events do not contribute. No rated events
        returns averageRating=null and ratedEventCount=0. Recommendations retain their
        existing calculation.
      parameters:
      - description: Organization database UUID (not Keycloak ID or alias)
        in: path
        name: organizationID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.OrganizerRatingSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Get organizer rating summary
      tags:
      - organizations
  /organizer-applications:
    post:
      consumes:
      - application/json
      description: Contact form of the authenticated user to become an organizer.
        The application waits for review by a global admin; approval creates the organization
        with the applicant as org_admin. Only one application per user can be pending.
        The alias must be 3-50 lowercase letters, digits or hyphens and start and
        end with a letter or digit.
      parameters:
      - description: Contact form
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.SubmitOrganizerApplicationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.OrganizerApplicationModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: An application is already pending, or the organization alias
            or name is taken
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Apply to become an organizer
      tags:
      - organizer-applications
  /payments/{paymentId}:
    get:
      description: 'Liefert den gespeicherten Zahlungsvorgang des Aufrufers: den Summenbetrag,
        den Zahlungsstatus und jedes Item mit Event, Ticketanzahl, Zeilenbetrag, Buchungsstatus
        und Ticketgültigkeit. Der Zahlungsvorgang deckt alle Buchungen eines Warenkorb-Checkouts
        ab und schließt sie zusammen ab. ticketsValid ist nur true, wenn die Zahlung
        bezahlt, alle Buchungen bestätigt sind und die Events stattfinden oder stattgefunden
        haben. Zahlung, Buchungen, Event-Status und Datenbankuhr stammen aus einer
        Abfrage. Offene Zahlungen abgelaufener Reservierungen schließt ein Hintergrundjob
        jede Minute als fehlgeschlagen ab. Zahlungsvorgänge anderer Nutzer liefern
        404.'
      parameters:
      - description: Payment ID
        in: path
        name: paymentId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PaymentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Zahlungsvorgang nicht gefunden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Zahlungsvorgang abrufen
      tags:
      - payments
  /payments/{paymentId}/simulate:
    post:
      consumes:
      - application/json
      description: Schließt den offenen Zahlungsvorgang des Aufrufers mit einem simulierten
        Ergebnis ab; es ist kein echter Zahlungsdienstleister angebunden. amount muss
        dem gespeicherten Summenbetrag entsprechen, sonst wird nichts geändert (422).
        Bei success werden alle Buchungen des Zahlungsvorgangs verbindlich bestätigt
        (bookingStatus confirmed, ticketsValid true). Bei failure, abgelaufener Reservierung
        oder nicht mehr verfügbarem Event schlägt die Zahlung fehl (status failed,
        failureReason, message), keine Buchung erhält einen Ticketanspruch und alle
        Tickets werden freigegeben — der Zahlungsvorgang gilt für alle Buchungen zusammen
        oder für keine. Das Ergebnis wird innerhalb der Transaktion aus dem gespeicherten
        Zahlungsstatus gelesen. Der Body darf höchstens 4 KiB groß sein (413).
      parameters:
      - description: Payment ID
        in: path
        name: paymentId
        required: true
        type: string
      - description: Simuliertes Ergebnis und angezeigter Betrag
        in: body
        name: payment
        required: true
        schema:
          $ref: '#/definitions/handler.SimulatePaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Ergebnis des Zahlungsvorgangs, erfolgreich oder fehlgeschlagen
          schema:
            $ref: '#/definitions/model.PaymentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Zahlungsvorgang nicht gefunden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Zahlung bereits abgeschlossen oder Buchung nicht reserviert
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "413":
          description: Request Body größer als 4 KiB
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Betrag weicht vom gespeicherten Betrag ab
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Zahlung simulieren
      tags:
      - payments
  /recommendations:
    get:
      description: Returns future published events with free capacity, excluding the
        user's confirmed bookings. Active reservations count toward capacity. Ranking
        weights category affinity (50%), confirmed ticket popularity (40%), and organizer
        ratings (10%).
      parameters:
      - description: Maximum number of recommendations after ranking; omitted returns
          all recommendations
        in: query
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.EventModel'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get event recommendations
      tags:
      - recommendations
  /users/me:
    get:
      description: Returns the authenticated user's profile, global roles, active
        organization, and organization memberships
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CurrentUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer {token}" where {token} is a Keycloak access token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
