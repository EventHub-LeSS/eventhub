  /events/{id}/restore-draft:
    post:
      description: Returns a cancelled event to draft so the owning organization can
        edit and publish it again. Requires event_manager in the owning organization.
        Only events withdrawn by their organizer are accepted; moderation withdrawals,
        completed, published and draft events return 400. Event ID, content and bookings
        are preserved. Incomplete events may be restored for editing; publication
        still checks completeness. The draft remains hidden from public listings and
        cannot be booked.
      parameters:
      - description: Event UUID
        in: path
        name: id
        required: true
        type: string
