      summary: Update event
      tags:
      - events
  /events/{id}/publish:
    post:
      description: Publishes a draft event or republishes a withdrawn (cancelled)
        event so that visitors can find and book it. Requires the event_manager role
        in the organization that owns the event. Only sufficiently complete events
        in status draft or cancelled can be published. Events withdrawn by moderation
