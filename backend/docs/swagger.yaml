      security:
      - BearerAuth: []
      summary: Create organization
      tags:
      - organizations
  /organizations/{organizationID}/audit-logs:
    get:
      description: 'Returns the audit log of an organization, newest entries first:
        who (personal account) changed what and when. Covers event changes (including
        price changes, publishing and cancellation) and changes of member roles. Requires
        the org_admin role in the given organization (global admins bypass this check).
        organizationID is the Keycloak organization ID or alias. Entries of operations
        in Keycloak consist of a "started" entry and a "succeeded" or "incomplete"
        entry with the same operationId; a "started" entry without a result means
        the outcome is unconfirmed. Entries are deleted ten years after they were
        recorded. Use nextCursor from the response as cursor to get the next page.'
      parameters:
      - description: Keycloak organization ID or Alias
        in: path
        name: organizationID
        required: true
        type: string
      - description: Entries per page (default 50, maximum 100)
        in: query
        name: limit
        type: integer
      - description: Cursor of the previous page
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AuditLogPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List organization audit log
      tags:
      - organizations
  /organizations/{organizationID}/members/{username}/roles:
    put:
      consumes:
      - application/json
      description: 'Replaces the complete role set of an organization member. Requires
        the org_admin role in the given organization (global admins bypass this check);
        it is checked against the token and again against Keycloak, so a demoted admin
        cannot act on an old token. organizationID is the Keycloak organization ID
        or alias as returned by POST /organizations and GET /users/me. roles is required;
        an empty array removes all roles. Roles: org_admin (manage members), event_manager
        (manage events), finance_viewer (view sales and billing). Removing the last
        org_admin is rejected. The affected user must refresh their token before the
        new roles take effect.'
      parameters:
      - description: Keycloak organization ID or Alias
        in: path
        name: organizationID
        required: true
        type: string
      - description: Username of the organization member
        in: path
        name: username
        required: true
        type: string
      - description: Complete role set for the member (empty array = no roles)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ConfigureOrgRolesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ConfigureOrgRolesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Configure organization member roles
      tags:
      - organizations
  /organizations/{organizationID}/rating-summary:
    get:
      description: Public average of unrounded event averages, with equal weight per
        rated event. Includes only this organization's published or completed events
        with endTime <= database time. Uses the same visible, score 1–5, confirmed-booking
        ratings as event summaries. Unrated events do not contribute. No rated events
        returns averageRating=null and ratedEventCount=0. Recommendations retain their
        existing calculation.
      parameters:
      - description: Organization database UUID (not Keycloak ID or alias)
        in: path
        name: organizationID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.OrganizerRatingSummary'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: Get organizer rating summary
      tags:
      - organizations
  /recommendations:
    get:
      description: Returns future published events with free capacity, excluding the
        user's confirmed bookings. Active reservations count toward capacity. Ranking
        weights category affinity (50%), confirmed ticket popularity (40%), and organizer
        ratings (10%).
      parameters:
      - description: Maximum number of recommendations after ranking; omitted returns
          all recommendations
        in: query
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.EventModel'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get event recommendations
      tags:
      - recommendations
  /users/me:
    get:
      description: Returns the authenticated user's profile, global roles, active
        organization, and organization memberships
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CurrentUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer {token}" where {token} is a Keycloak access token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
