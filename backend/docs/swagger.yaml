  /cart:
    delete:
      description: Entfernt alle Warenkorb-Items des Aufrufers und gibt deren Plätze
        sofort frei. Reservierungen mit offener Zahlung gehören nicht zum Warenkorb
        und bleiben unberührt.
      produces:
      - application/json
      responses:
        "200":
          description: Leerer Warenkorb
          schema:
            $ref: '#/definitions/model.CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Warenkorb leeren
      tags:
      - cart
    get:
      description: 'Liefert den Warenkorb des Aufrufers: jede lebende Reservierung
        ohne Zahlung mit der aktuellen Verfügbarkeit und den aktuellen Preisen ihres
        Events. Reservierungen halten ihre Plätze bis expiresAt; danach sind sie nicht
        mehr Teil des Warenkorb. totalAmount ist die Summe der aktuellen Zeilenbeträge
        — der Checkout berechnet und speichert den zu zahlenden Betrag selbst. checkoutReady
        ist nur true, wenn der Warenkorb Items hat und alle Events noch veröffentlicht
        sind. openPayment nennt den offenen Zahlungsvorgang des Aufrufers, falls einer
        existiert: Dessen Items haben den Warenkorb verlassen und warten auf ihre
        Zahlung — sie halten ihre Plätze bis expiresAt — und neue Items können erst
        ausgecheckt werden, wenn der Vorgang abgeschlossen ist.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.CartResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Warenkorb abrufen
      tags:
      - cart
  /cart/checkout:
    post:
      description: 'Überführt alle lebenden Reservierungen des Aufrufers in einen
        Zahlungsvorgang: ein Zahlung mit dem Summenbetrag und pro Item ein Betrag
        aus Ticketanzahl mal aktuellem Event-Preis, alles serverseitig berechnet und
        gespeichert; Beträge vom Client werden ignoriert. Alle Buchungen teilen sich
        eine erneuerte Reservierungsfrist (15 Minuten) — die Zahlung muss vor expiresAt
        abgeschlossen werden. Items mit abgelaufener Reservierung halten keine Plätze
        und werden ausgelassen; ist kein Item mehr lebend, liefert der Aufruf 409
        bzw. 422 bei leerem Warenkorb. Ein Event, das nicht mehr veröffentlicht ist,
        lässt den gesamten Checkout scheitern (409), weil die Zahlung alle Items zusammen
        oder gar nicht abschließt. Existiert bereits ein offener Zahlungsvorgang,
        wird dieser unverändert zurückgegeben (200).'
      produces:
      - application/json
      responses:
        "200":
          description: Offener Zahlungsvorgang existierte bereits
          schema:
            $ref: '#/definitions/model.PaymentResponse'
        "201":
          description: Zahlungsvorgang angelegt
          schema:
            $ref: '#/definitions/model.PaymentResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Reservierungen abgelaufen oder Event nicht mehr verfügbar
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Warenkorb ist leer
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Warenkorb auschecken
      tags:
      - cart
  /cart/items:
    post:
      consumes:
      - application/json
      description: Reserviert Tickets eines veröffentlichten Events für den AufrufER
        und legt sie damit in den Warenkorb. Die Reservierung hält die Plätze bis
        expiresAt (15 Minuten) und verfällt danach. Existiert bereits ein Item für
        das Event, wächst dessen Anzahl (höchstens 10 pro Event) und die Reservierung
        wird erneuert; ein abgelaufenes Item wird ersetzt. Der Platz wird wie bei
        einer Buchung sofort gegen die Kapazität geprüft (409). Die Antwort ist der
        Warenkorb nach der Änderung.
      parameters:
      - description: Event und Ticketanzahl
        in: body
        name: item
        required: true
        schema:
          $ref: '#/definitions/handler.AddCartItemRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Warenkorb nach dem Hinzufügen
          schema:
            $ref: '#/definitions/model.CartResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Event unbekannt
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Event nicht veröffentlicht oder Kapazität überschritten
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "422":
          description: Mehr als 10 Tickets für ein Event
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Tickets in den Warenkorb legen
      tags:
      - cart
