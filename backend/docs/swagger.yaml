basePath: /api/v1
definitions:
  handler.CurrentOrganizationResponse:
    properties:
      alias:
        type: string
      id:
        type: string
      roles:
        items:
          $ref: '#/definitions/middleware.OrganizationRole'
        type: array
    type: object
  handler.CurrentUserResponse:
    properties:
      globalRoles:
        items:
          $ref: '#/definitions/middleware.GlobalRole'
        type: array
      organization:
        $ref: '#/definitions/handler.CurrentOrganizationResponse'
      organizations:
        items:
          $ref: '#/definitions/handler.CurrentOrganizationResponse'
        type: array
      subject:
        type: string
      username:
        type: string
    type: object
  handler.UserAdminListItem:
    properties:
      email:
        type: string
      firstName:
        type: string
      keycloakUserId:
        type: string
      lastName:
        type: string
      phoneNumber:
        type: string
      roles:
        items:
          type: string
        type: array
      userId:
        type: string
    type: object
  handler.UserAdminListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/handler.UserAdminListItem'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
  handler.UserAdminRolesRequest:
    properties:
      roles:
        items:
          type: string
        type: array
    required:
    - roles
    type: object
  handler.UserAdminRolesResponse:
    properties:
      keycloakUserId:
        type: string
      roles:
        items:
          type: string
        type: array
      userId:
        type: string
    type: object
  middleware.GlobalRole:
    enum:
    - admin
    - moderator
    - visitor
    type: string
    x-enum-varnames:
    - RoleAdmin
    - RoleModerator
    - RoleVisitor
  middleware.OrganizationRole:
    enum:
    - org_admin
    - event_manager
    - finance_viewer
    type: string
    x-enum-varnames:
    - RoleOrganizationAdmin
    - RoleEventManager
    - RoleFinanceViewer
  model.APIError:
    properties:
      error:
        $ref: '#/definitions/model.APIErrorDetail'
    type: object
  model.APIErrorDetail:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  model.ConfigureOrgRolesRequest:
    properties:
      roles:
        items:
          $ref: '#/definitions/model.OrganizationRole'
        type: array
        uniqueItems: true
    required:
    - roles
    type: object
  model.ConfigureOrgRolesResponse:
    properties:
      message:
        type: string
      organizationId:
        type: string
      roles:
        items:
          type: string
        type: array
      username:
        type: string
    type: object
  model.CreateOrganizationRequest:
    properties:
      alias:
        type: string
      city:
        type: string
      contactEmail:
        type: string
      contactPhoneNumber:
        type: string
      countryCode:
        type: string
      houseNumber:
        type: string
      name:
        type: string
      orgAdmin:
        type: string
      postalCode:
        type: string
      street:
        type: string
    required:
    - alias
    - name
    - orgAdmin
    type: object
  model.CreateOrganizationResponse:
    properties:
      alias:
        type: string
      id:
        type: string
      message:
        type: string
      name:
        type: string
    type: object
  model.DebugTokenRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  model.DebugTokenResponse:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      refresh_token:
        type: string
      token_type:
        type: string
    type: object
  model.ErrorResponse:
    properties:
      detail:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  model.EventActionResponse:
    properties:
      message:
        example: event published
        type: string
    type: object
  model.EventModel:
    properties:
      capacity:
        type: integer
      categoryId:
        type: string
      createdAt:
        type: string
      description:
        type: string
      endTime:
        type: string
      eventId:
        type: string
      locationId:
        type: string
      organizerId:
        type: string
      price:
        type: number
      startTime:
        type: string
      status:
        $ref: '#/definitions/model.EventStatus'
      title:
        type: string
      updatedAt:
        type: string
    type: object
  model.EventStatus:
    enum:
    - draft
    - published
    - cancelled
    - completed
    type: string
    x-enum-varnames:
    - EventStatusDraft
    - EventStatusPublished
    - EventStatusCancelled
    - EventStatusCompleted
  model.HealthcheckModel:
    properties:
      message:
        type: string
      time:
        type: string
    type: object
  model.OrganizationRole:
    enum:
    - org_admin
    - event_manager
    - finance_viewer
    type: string
    x-enum-varnames:
    - RoleOrganizationAdmin
    - RoleEventManager
    - RoleFinanceViewer
  model.UpdateEventRequest:
    properties:
      capacity:
        minimum: 1
        type: integer
      categoryId:
        type: string
      description:
        maxLength: 5000
        type: string
      endTime:
        type: string
      locationId:
        type: string
      price:
        minimum: 0
        type: number
      startTime:
        type: string
      title:
        maxLength: 200
        minLength: 3
        type: string
    required:
    - capacity
    - categoryId
    - endTime
    - locationId
    - startTime
    - title
    type: object
info:
  contact: {}
  description: REST API for the EventHub platform
  title: EventHub API
  version: "1.0"
paths:
  /:
    get:
      description: Returns service health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.HealthcheckModel'
      summary: Health check
      tags:
      - system
  /admin/users:
    get:
      description: Returns a database page of shared users ordered by userId ascending,
        with their current global roles. Only users on this page are looked up in
        Keycloak, with at most four concurrent lookups and a 15-second total role-lookup
        timeout. Available only to global admins. total counts all database users;
        concurrent user creation or deletion can cause count/page differences.
      parameters:
      - default: 1
        description: Page number (1-indexed)
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 50
        description: Page size (1-100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserAdminListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
  /admin/users/{userID}/roles:
    get:
      description: Returns the effective global roles for a user. Available only to
        global admins.
      parameters:
      - description: Database user UUID
        in: path
        name: userID
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserAdminRolesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get user roles
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Replaces the user's global roles with the submitted set. Only global
        admins may perform this change; the change is applied in Keycloak and takes
        effect after a fresh token or login.
      parameters:
      - description: Database user UUID
        in: path
        name: userID
        required: true
        type: string
      - description: Roles to assign
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UserAdminRolesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.UserAdminRolesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update user roles
      tags:
      - users
  /debug/token:
    post:
      consumes:
      - application/json
      description: TEST ONLY — accepts username/password and returns a Keycloak access
        token. Disabled in production (requires DEBUG_ENABLED=true).
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.DebugTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.DebugTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      summary: '[DEBUG] Get access token'
      tags:
      - debug
  /events/{id}:
    put:
      consumes:
      - application/json
      description: Updates title, description, time span, location, category, price
        and capacity of an event. Requires the event_manager role in the organization
        that owns the event. Only events in status draft or published can be edited.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated event data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.UpdateEventRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EventModel'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update event
      tags:
      - events
  /events/{id}/publish:
    post:
      description: Publishes a draft event so that visitors can find and book it.
        Requires the event_manager role in the organization that owns the event. Only
        sufficiently complete events in status draft can be published.
      parameters:
      - description: Event ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.EventActionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Publish event
      tags:
      - events
  /organizations/:
    post:
      consumes:
      - application/json
      description: Creates a new organization in Keycloak and the API database. Requires
        the admin role on the backend client.
      parameters:
      - description: Organization to create
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateOrganizationRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.CreateOrganizationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create organization
      tags:
      - organizations
  /organizations/{organizationID}/members/{username}/roles:
    put:
      consumes:
      - application/json
      description: 'Replaces the complete role set of an organization member. Requires
        the org_admin role in the given organization (global admins bypass this check);
        it is checked against the token and again against Keycloak, so a demoted admin
        cannot act on an old token. organizationID is the Keycloak organization ID
        or alias as returned by POST /organizations and GET /users/me. roles is required;
        an empty array removes all roles. Roles: org_admin (manage members), event_manager
        (manage events), finance_viewer (view sales and billing). Removing the last
        org_admin is rejected. The affected user must refresh their token before the
        new roles take effect.'
      parameters:
      - description: Keycloak organization ID or Alias
        in: path
        name: organizationID
        required: true
        type: string
      - description: Username of the organization member
        in: path
        name: username
        required: true
        type: string
      - description: Complete role set for the member (empty array = no roles)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.ConfigureOrgRolesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.ConfigureOrgRolesResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/model.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/model.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Configure organization member roles
      tags:
      - organizations
  /users/me:
    get:
      description: Returns the authenticated user's profile, global roles, active
        organization, and organization memberships
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.CurrentUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/model.APIError'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Enter "Bearer {token}" where {token} is a Keycloak access token
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
